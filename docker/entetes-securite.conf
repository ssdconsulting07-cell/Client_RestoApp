# En-tetes de securite HTTP, inclus dans le bloc server ET dans chaque
# location qui definit ses propres add_header (sinon nginx ne les herite pas).
#
# CSP : scripts uniquement servis par l'app (aucun script inline, ni eval) ;
# styles inline autorises (attributs style de React) ; images https (photos
# produits saisies par le Gerant) ; carte OpenStreetMap en iframe ;
# API sur la meme origine (/api/ relaye par nginx).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'; frame-src https://www.openstreetmap.org; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
# Geolocalisation pour l'adresse de livraison ; le reste coupe.
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy same-origin always;
