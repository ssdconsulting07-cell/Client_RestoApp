# App Client en conteneur, branchee sur le backend de la machine
# (Backend_RestoApp : docker compose up, port 8080).
#
#   docker compose up -d --build      -> http://localhost:8081
#
# Mock de demonstration (sans backend) : CLIENT_API_BASE_URL=/api-mock.
#
# Le mock (json-server) repart a chaque demarrage d'une copie neuve de
# db.json : les commandes de test ne modifient pas le fichier du depot.
# Variables reglables dans un fichier .env a cote de ce fichier (voir
# .env.example, section Docker).
name: senyummies-client

services:
  client:
    build:
      context: .
      args:
        # Version affichee dans l'app (tag Git de la livraison, ex. v1.2.0).
        APP_VERSION: ${APP_VERSION:-}
    image: senyummies/client:${IMAGE_TAG:-local}
    ports:
      - "${CLIENT_PORT:-8081}:8080"
    environment:
      # Vrai backend : /api/v1, relaye par nginx vers API_UPSTREAM.
      # Mock de demonstration : /api-mock.
      API_BASE_URL: ${CLIENT_API_BASE_URL:-/api/v1}
      API_UPSTREAM: ${API_UPSTREAM:-http://host.docker.internal:8080}
      SUPPORT_TELEPHONE: ${SUPPORT_TELEPHONE:-}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      # Marque du restaurant (vide = SenYummies) : voir README, section Docker.
      MARQUE_NOM: ${MARQUE_NOM:-}
      MARQUE_NOM_ACCENT: ${MARQUE_NOM_ACCENT:-}
      MARQUE_INITIALES: ${MARQUE_INITIALES:-}
      MARQUE_LOGO_URL: ${MARQUE_LOGO_URL:-}
      MARQUE_SLOGAN: ${MARQUE_SLOGAN:-}
      MARQUE_SOUS_TITRE: ${MARQUE_SOUS_TITRE:-}
      MARQUE_COULEUR: ${MARQUE_COULEUR:-}
      MARQUE_COULEUR_CLAIRE: ${MARQUE_COULEUR_CLAIRE:-}
    # Logo et icones du restaurant (facultatif) : decommenter.
    # volumes:
    #   - ./marque:/marque:ro
    extra_hosts:
      # host.docker.internal aussi sous Linux (backend lance sur la machine).
      - "host.docker.internal:host-gateway"
    depends_on:
      - api-mock
    restart: unless-stopped

  api-mock:
    build:
      context: .
      dockerfile_inline: |
        FROM node:20-alpine
        RUN npm install -g json-server@0.17.4 --no-audit --no-fund
        WORKDIR /data
        CMD ["sh", "-c", "cp /seed/db.json /data/db.json && json-server --host 0.0.0.0 --port 3101 /data/db.json"]
    image: senyummies/client-api-mock:${IMAGE_TAG:-local}
    volumes:
      - ./db.json:/seed/db.json:ro
    restart: unless-stopped
